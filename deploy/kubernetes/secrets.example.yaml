# 不属于kustomization。由Secret/Vault控制器生成，替换占位值后保存在仓库外。
apiVersion: v1
kind: Secret
metadata: {name: ai-service-secrets, namespace: ai-platform}
type: Opaque
stringData:
  FORGE_DB_PASSWORD: REPLACE_AI_APP_PASSWORD
  FORGE_DB_MIGRATOR_PASSWORD: REPLACE_AI_MIGRATOR_PASSWORD
  FORGE_MANIFEST_TOKEN: REPLACE_SERVICE_CREDENTIAL
  FORGE_OPS_TOKEN: REPLACE_AI_OPS_TOKEN
  AI_RUNNER_SERVICE_TOKEN: REPLACE_RUNNER_SERVICE_TOKEN
  AI_MODEL_CREDENTIAL_KEY: REPLACE_MODEL_CREDENTIAL_KEY
  MODEL_DEEPSEEK_API_KEY: REPLACE_MODEL_KEY
  # 有租户凭据的审核MCP目录使用服务端派生变量名：
  # AI_MCP_<TENANT_UUID去连字符大写>_<CATALOG_UUID去连字符大写>: REPLACE_MCP_KEY
---
apiVersion: v1
kind: Secret
metadata: {name: ai-runner-identity, namespace: ai-platform}
type: Opaque
stringData:
  AI_RUNNER_SERVICE_TOKEN: REPLACE_SAME_RUNNER_SERVICE_TOKEN
